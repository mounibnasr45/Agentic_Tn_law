name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans history, not just the working tree

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . --output-format=github

      - name: Unit tests
        # No DATABASE_URL, so the integration suite skips. These run against in-memory
        # fakes: no model download, no database, no network, no API key.
        run: pytest tests --ignore=tests/integration --cov=app --cov-report=term-missing

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal
          POSTGRES_PASSWORD: legal
          POSTGRES_DB: legal
        ports:
          - 5432:5432
        # The job must wait for readiness, not merely for the container to start.
        options: >-
          --health-cmd "pg_isready -U legal -d legal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://legal:legal@localhost:5432/legal
        run: alembic upgrade head

      - name: Integration tests
        env:
          DATABASE_URL: postgresql+psycopg://legal:legal@localhost:5432/legal
        run: pytest tests/integration -v

  eval:
    name: Retrieval evaluation
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal
          POSTGRES_PASSWORD: legal
          POSTGRES_DB: legal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legal -d legal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://legal:legal@localhost:5432/legal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # CPU-only torch. Plain `pip install torch` pulls ~2GB of CUDA wheels onto a
        # runner with no GPU, which is most of this job's wall-clock time.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Cache the embedding model
        # ~450MB from HuggingFace on every run otherwise.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('app/core/config.py') }}

      - name: Migrate and ingest the corpus
        run: |
          alembic upgrade head
          python -m app.cli ingest

      - name: Ablation + regression gate
        # Writes the markdown table to the job summary, so it renders on the PR itself
        # instead of being buried in a log. Fails the build if any arm's hit@5 drops
        # more than 3 points below eval/baseline.json.
        run: python -m eval.ablation --gate
