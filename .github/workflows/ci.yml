name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans history, not just the working tree

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS, matching web/Dockerfile. Angular 22 also supports 20.19+ and 24,
          # so a developer on Node 24 locally is fine — but CI and the image agree.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # `ci`, not `install`: installs the lockfile exactly and fails if it has drifted
        # from package.json, rather than quietly resolving something new.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # Includes the single-flight refresh regression test — the one that fails if a
        # concurrent 401 storm is ever allowed to fire more than one /auth/refresh.
        run: npm test

      - name: Build
        # Also enforces the production bundle budgets declared in angular.json.
        run: npm run build

  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . --output-format=github

      - name: Unit tests
        # No DATABASE_URL, so the integration suite skips. These run against in-memory
        # fakes: no model download, no database, no network, no API key.
        run: pytest tests --ignore=tests/integration --cov=app --cov-report=term-missing

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal
          POSTGRES_PASSWORD: legal
          # Named "..._test", not "legal": tests/integration/conftest.py refuses to run
          # against any database whose name doesn't look like a test database (it TRUNCATEs
          # everything on every fixture — see the guard's docstring for the incident that
          # made it exist). This is a fresh, disposable service container scoped to this
          # job, but the guard can't tell that from a name alone, so the name has to say so.
          POSTGRES_DB: legal_test
        ports:
          - 5432:5432
        # The job must wait for readiness, not merely for the container to start.
        options: >-
          --health-cmd "pg_isready -U legal -d legal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://legal:legal@localhost:5432/legal_test
        run: alembic upgrade head

      - name: Integration tests
        env:
          DATABASE_URL: postgresql+psycopg://legal:legal@localhost:5432/legal_test
          # Not the committed default. Proves the app reads it from the environment, and
          # keeps CI from being the one place the insecure default is exercised.
          JWT_SECRET: ci-only-secret-at-least-thirty-two-bytes-long
        run: pytest tests/integration -v

  eval:
    name: Retrieval evaluation
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal
          POSTGRES_PASSWORD: legal
          POSTGRES_DB: legal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legal -d legal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://legal:legal@localhost:5432/legal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # CPU-only torch. Plain `pip install torch` pulls ~2GB of CUDA wheels onto a
        # runner with no GPU, which is most of this job's wall-clock time.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Cache the embedding model
        # ~450MB from HuggingFace on every run otherwise.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('app/core/config.py') }}

      - name: Migrate and ingest the corpus
        run: |
          alembic upgrade head
          python -m app.cli ingest

      - name: Ablation + regression gate
        # Writes the markdown table to the job summary, so it renders on the PR itself
        # instead of being buried in a log. Fails the build if any arm's hit@5 drops
        # more than 3 points below eval/baseline.json.
        run: python -m eval.ablation --gate

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # The course's needs: pattern (Lesson 6), applied for real: this job cannot start
    # until every other job has succeeded. A red unit job, a broken migration, or a
    # regressed hit@5 all block the deploy — there is no path from a failing pipeline to
    # production.
    needs: [secrets, frontend, unit, integration, eval]
    # Deploy on a push to main only — never from a pull_request event (a PR from a fork
    # could otherwise trigger a production deploy before anyone reviews it) and never from
    # a push to any other branch.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        # Render builds the image itself from the same commit and runs render.yaml's
        # preDeployCommand (migrate + ingest) before marking the new version live — this
        # curl only starts that process, it does not wait for it. Auto-deploy is OFF in
        # render.yaml specifically so this hook is the only thing that can trigger a
        # deploy, and it only fires after every job above is green.
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL repo secret is not set. Render service" \
                 "settings -> Deploy Hook -> copy the URL -> repo Settings -> Secrets and" \
                 "variables -> Actions -> New repository secret."
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
